<ion-card>
  <ion-grid>
    <ion-row>
      <ion-col size="4">
        <img [src]="getImgSrc()" />
      </ion-col>
      <ion-col size="8">
        <ion-card-content>
          <ion-card-title>{{ pack.name }}</ion-card-title>
          <ion-item>
            <ion-checkbox slot="start" (click)="checkPacksStorage()" [checked]="pack.checked"></ion-checkbox>
            <ion-text> Lo tengo </ion-text>
          </ion-item>
          <ion-text> Número total de cartas: {{ pack.total }}</ion-text>
        </ion-card-content>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-card>
