<ion-card (click)="navigateToBattles()">
  <ion-grid>
    <ion-row>
      <ion-col size="4">
        <img [src]="returnUrl()" />
      </ion-col>
      <ion-col size="8">
        <ion-card-title>{{ character.name }}</ion-card-title>
        <ion-item *ngIf="character.linked_to_name">
          <ion-text>
            Alter ego: {{ character.linked_to_name }}
          </ion-text>
        </ion-item>
        <ion-item *ngIf="character.flavor">
          <ion-text>
            {{ character.flavor }}
          </ion-text>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-card-content>
      <ion-item>
        <ion-text [innerHtml]="character.text ? character.text : character.real_text">
        </ion-text>
      </ion-item>
    </ion-card-content>
  </ion-grid>
</ion-card>
